name: Weather Forecast

on:
  schedule:
    # Every day at 02:00 UTC (07:30 IST — morning update)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: rsb-23/actions/checkout@main

      - name: Set up Python
        uses: rsb-23/actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Run weather fetcher
        run: python scripts/fetch_weather.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --staged --quiet \
            || git commit -m "data: update weather forecast $(date -u +'%Y-%m-%d') [skip ci]"
          git push
