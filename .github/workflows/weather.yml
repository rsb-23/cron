name: Weather Forecast

on:
  schedule:
    # Every day at 02:00 UTC (07:30 IST — morning update)
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: rsb-23/actions/checkout@main
        with:
          persist-credentials: true
      - uses: rsb-23/actions/setup-python@main

      - name: Run weather fetcher
        run: python scripts/fetch_weather.py

      - name: Commit and push changes
        uses: rsb-23/actions/commit-n-push@main
        with:
          git_user: "cron[bot]"
          files: "data/"
          commit_message: "data: update weather forecast [skip ci]"
